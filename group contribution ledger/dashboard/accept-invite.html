<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accept Invitation | group contribution ledger</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><section class="intro"><div><h1>Set your member password</h1><p class="intro-copy">Use at least 8 characters with uppercase, lowercase, and numeric characters. This invitation link can be used once.</p></div></section><form id="invite-form" class="panel auth-dialog-form"><label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><p id="invite-error" role="alert"></p><button type="submit">Set password and log in</button></form></main><script>
const form=document.getElementById('invite-form');const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);form.addEventListener('submit',async event=>{event.preventDefault();const values=new FormData(form);const password=values.get('password');if(password.length<8||!/[a-z]/.test(password)||!/[A-Z]/.test(password)||!/[0-9]/.test(password)){document.getElementById('invite-error').textContent='Use at least 8 characters with uppercase, lowercase, and numeric characters.';return;}if(password!==values.get('confirm')){document.getElementById('invite-error').textContent='The passwords do not match.';return;}const button=form.querySelector('[type=submit]');if(button.disabled)return;button.disabled=true;button.textContent='Setting password…';try{const response=await fetch('/api/auth/accept-invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invite:token,password})});const result=await response.json();if(!response.ok){document.getElementById('invite-error').textContent=result.detail||'Could not redeem the invitation.';return;}location.assign('/');}catch{document.getElementById('invite-error').textContent='Network error. Please try again.';}finally{button.disabled=false;button.textContent='Set password and log in';}});
</script></body></html>
