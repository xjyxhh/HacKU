<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c3d">
  <title>Contribution Graph · 我的工作区</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
  <script src="/auth.js" defer></script>
  <script src="/workspace.js" defer></script>
</head>
<body hidden>
  <a class="skip-link" href="#main-content">跳转到主要内容</a>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">CG</span><span>Contribution Graph</span></div><div class="top-actions"><a class="nav-link" href="/">项目看板</a><a class="nav-link" href="/profile.html">编辑 Profile</a></div></header>
    <main id="main-content" tabindex="-1">
      <section class="intro"><div><p class="kicker">MY WORKSPACE</p><h1 id="greeting">我的项目</h1><p class="intro-copy">管理你创建和参与的项目。选择项目进入 Dashboard。</p></div></section>
      <div id="error" class="error" role="alert" hidden></div>
      <section class="panel"><div class="section-head"><div><h2>我负责的项目</h2><p class="section-note">Owner 项目和初始化进度</p></div></div><div id="owned-projects" class="members"></div><p id="owned-empty" class="empty" hidden>目前没有由你负责的项目。</p></section>
      <section class="panel"><div class="section-head"><div><h2>我参与的项目</h2><p class="section-note">查看角色、余额和待处理事项</p></div></div><div id="joined-projects" class="members"></div><p id="empty" class="empty" hidden>你还没有参与其他项目。创建一个项目，或请项目 Owner 邀请你加入。</p></section>
      <section class="panel entry-panel"><h2>创建项目</h2><form id="create-project" class="auth-form"><label>项目名称<input name="name" required maxlength="160"></label><label>项目 ID<input name="id" required pattern="[A-Za-z0-9_-]+" maxlength="128"></label><button type="submit">创建并进入项目</button></form></section>
    </main>
    <footer>Contribution Graph · Profile 管项目，Project 管协作</footer>
  </div>
</body>
</html>
