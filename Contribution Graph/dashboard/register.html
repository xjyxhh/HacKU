<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c3d">
  <title>Contribution Graph · 注册</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
  <script src="/register.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <header class="auth-brand"><a href="/landing.html"><span class="brand-mark" aria-hidden="true">CG</span></a><span>Contribution Graph</span></header>
    <section class="panel auth-panel">
      <p class="kicker">CREATE YOUR ACCOUNT</p>
      <h1>注册</h1>
      <p class="section-note">注册后进入个人工作区，可创建项目或由项目 Owner 邀请加入。</p>
      <div id="message" class="error" role="alert" hidden></div>
      <form id="register-form" class="auth-form">
        <label>邮箱<input name="email" type="email" autocomplete="email" required maxlength="320"></label>
        <label>显示名称<input name="display_name" autocomplete="name" required maxlength="120"></label>
        <label>密码<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label>
        <label>确认密码<input name="confirm_password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label>
        <button type="submit">创建账号</button>
      </form>
      <p class="section-note">已有账号？<a href="/login.html">登录</a></p>
    </section>
  </main>
</body>
</html>
