<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建账号 · Contribution Graph</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js" defer></script><script src="/auth.js?v=5" defer></script><script src="/register.js" defer></script></head>
<body><a class="skip-link" href="#main-content">跳转到主要内容</a><div class="shell"><nav class="page-nav" aria-label="页面导航"><div class="sidebar-brand"><span class="brand-mark">CG</span><span>Contribution Graph</span></div><a href="/">项目看板</a><a href="/review.html">贡献审核</a><a href="/token.html">Token 工作台</a><a href="/demo.html">公开 Demo</a><details class="settings"><summary>设置</summary><div class="settings-menu"><label for="language-select">语言</label><select id="language-select"><option value="en">English</option><option value="zh">中文</option></select></div></details></nav><header class="topbar"><div class="top-actions"></div></header><main id="main-content" tabindex="-1"><section class="panel auth-page"><p class="kicker">ACCOUNT</p><h1>创建账号</h1><p>注册会创建一个空账号，不会自动加入现有项目。账号保存在本地数据库，之后可用注册邮箱或成员 ID 登录。</p><form id="register-form"><label>显示名<input name="display_name" maxlength="120" required></label><label>邮箱<input name="email" type="email" maxlength="320" autocomplete="email" required></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">创建账号</button></form><p id="register-message" role="status"></p><p>已有账号？<a href="/">返回看板并登录</a></p></section></main></div></body></html>
