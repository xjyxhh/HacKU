<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人资料 · Contribution Graph</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js" defer></script><script src="/auth.js?v=5" defer></script><script src="/profile.js" defer></script></head><body><a class="skip-link" href="#main-content">跳转到主要内容</a><div class="shell"><nav class="page-nav" aria-label="页面导航"><div class="sidebar-brand"><span class="brand-mark">CG</span><span>Contribution Graph</span></div><a href="/">项目看板</a><a href="/review.html">贡献审核</a><a href="/token.html">Token 工作台</a><a href="/workspace.html">我的工作区</a><a href="/demo.html">公开 Demo</a><details class="settings"><summary>设置</summary><div class="settings-menu"><a href="/profile.html" aria-current="page">个人资料</a><label for="language-select">语言</label><select id="language-select"><option value="en">English</option><option value="zh">中文</option></select></div></details></nav><header class="topbar"><div class="top-actions"></div></header><main id="main-content" tabindex="-1"><section class="panel auth-page"><p class="kicker">PROFILE</p><h1>个人资料</h1><p id="profile-status" role="status"></p><form id="profile-form"><label>成员 ID<input name="memberId" readonly></label><label>显示名<input name="display_name" maxlength="120" required></label><label>邮箱<input name="email" readonly></label><p>邮箱尚未验证。当前环境未配置验证邮件服务；修改邮箱请联系管理员。</p><label>头像图片 HTTPS 链接<input name="avatar_url" type="url" maxlength="2048" placeholder="https://..."></label><label>简短介绍<textarea name="bio" maxlength="500" rows="4"></textarea></label><button type="submit">保存资料</button></form><form id="email-form"><h2>更改邮箱</h2><label>新邮箱<input name="email" type="email" required></label><button type="submit">发送验证链接</button></form></section></main></div></body></html>
